<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BBINSIDER - Shot Map</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>

<header>
    <h1>BuzzerCheater</h1>
</header>

<div id="shots-screen">
  <div id="sidebar">

    <h3>Calendari</h3>
    <div class="container">
      <label>Team ID</label>
      <input id="teamid" type="text" value="138045"><br>

      <label>Season</label>
      <input id="season" type="number" value="71"><br>

      <button class="submit" onclick="loadSchedule()">Load schedule</button>

      <hr>
      <div id="matches"></div>
    </div>
  </div>

  <div id="result-screen">
    <h3>Mapa de tirs</h3>

    <div class="container">
      
      <p>Partits seleccionats:</p>
      <input type = "hidden" id="match_ids" name="match_ids">
      <div id="selected-matches"></div>

      <form id="shotmap-form">

        <label>
          Equip:
          <select id="team">
            <option value="home">Home</option>
            <option value="away">Away</option>
            <option value="home,away" selected="true">Home & Away</option>
          </select>
        </label><br>

        <label>
          Jugador (optional):
          <input type="text" id="player">
        </label><br>

        <label for="show-ind-shots"> Show individual shots<br>
          <input type="checkbox" id="show-ind-shots">
        </label><br>

        <button class= "submit" type="submit">Watch stats</button>

      </form>

      <div id="progress-container" class="inactive">
        <div id="progress-bar"></div>
      </div>

      <div id="result">
        <h3>Shot map</h3>
        <img id="shotmap-img" alt="Shot map">
        <h3>Assisted vs Unassisted shots</h3>
        <div id="assisted-stats"></div>
      </div>

    </div>
    <br><br>
    <h3>Entrenament</h3>
    <div id="training-screen">
      <div class="container">
        <label>Player ID</label>
        <input id="player_id" value="54646103"><br><br>

        <label>Coach level</label>
        <select id="coach">
            <option>1</option><option>2</option><option>3</option>
            <option selected>4</option>
            <option>5</option><option>6</option><option>7</option>
        </select><br><br>

        <label>Setmana actual (1 - 14)</label>
        <input id="current_week" type="number" value="5" min="1" max="14" required="true"><br><br>

        <h3>Training plan</h3>
        <div id="plan" class="training-grid"></div>

        <button id="training-btn">Simulate training plan</button>

        <pre id="output"></pre>
      </div>
    </div>

  </div>
</div>

<script src="/web/script.js"></script>
</body>
</html>
